web-editor:
  enabled: true

# Published on SwagAPI's event bus (discordutils:notify channel). Requires DiscordUtils to
# be installed with a matching "webhooks.<webhook-name>" entry in ITS config.yml — no
# compile-time or reflection dependency on DiscordUtils from this plugin.
discord:
  enabled: true
  webhook-name: "tournaments"
  live-updates-enabled: false
  live-updates-interval-minutes: 15
  colors:
    FISHING: "#3399FF"
    FARMING: "#44BB44"
    COMBAT: "#FF4444"
    MINING: "#AAAAAA"
    ECONOMY: "#FFDD00"
    CUSTOM: "#AA44AA"

auto-schedule:
  enabled: false
  interval-minutes: 180
  duration-minutes: 30
  min-players: 2
  warning-minutes: 5

integrations:
  swag-fishing:
    enabled: true
  swag-farming:
    enabled: true
  discord-utils:
    enabled: true
